; PlatformIO Project Configuration File
; Target Hardware: Waveshare ESP32-S3-RLCD-4.2 (ESP32-S3-WROOM-1-N16R8)
;   - MCU: ESP32-S3 (240MHz Dual-Core Xtensa LX7, Native USB OTG)
;   - Memory: 16MB Quad Flash + 8MB Octal PSRAM (qio_opi)
;   - Display: 4.2" 400x300 ST7305 Monochrome Reflective LCD (RLCD)
;   - Sensors/Audio: SHTC3 (I2C 0x70), PCF85063 RTC (I2C 0x51), ES8311 DAC (I2C 0x18 + I2S)
;   - Storage: 1-bit SD_MMC MicroSD slot (CLK=21, CMD=38, D0=39)

[platformio]
default_envs = waveshare_esp32s3_rlcd42

[env:waveshare_esp32s3_rlcd42]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; 16MB Flash + 8MB Octal PSRAM configuration for ESP32-S3-WROOM-1-N16R8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17

build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.22
    mathieucarbou/AsyncTCP @ ^3.2.14

monitor_speed = 115200

; Optional Wireless OTA upload (uncomment after first Wi-Fi setup):
; upload_protocol = espota
; upload_port = bulletspy.local
